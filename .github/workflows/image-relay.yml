name: image-relay
on:
  workflow_dispatch:
    inputs:
      image:
        description: "docker image (name:tag)"
        required: true
      artifact:
        description: "artifact name"
        required: true
jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - name: Pull and save
        run: |
          docker pull "${{ github.event.inputs.image }}"
          docker save "${{ github.event.inputs.image }}" | gzip > /tmp/image.tar.gz
          ls -lh /tmp/image.tar.gz
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.artifact }}
          path: /tmp/image.tar.gz
          retention-days: 3
